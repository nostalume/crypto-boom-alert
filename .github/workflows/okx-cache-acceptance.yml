name: OKX cache acceptance

"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bootstrap, restore]
        default: bootstrap
      producer_run:
        type: string
        default: ""
      producer_sha:
        type: string
        default: ""
      bundle_digest:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: okx-cache-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CACHE: "1"
      PIP_NO_CACHE_DIR: "1"
      CACHE_MODE: ${{ inputs.mode }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_SHA: ${{ inputs.producer_sha }}
      BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.17
          uv pip install --python "$(command -v python)" --no-cache -r requirements.txt -r requirements-dev.txt
      - name: Verify offline contracts
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/okx-cache-tests"
          python -m ruff check --no-cache --select F,I,RUF100 src tests
      - name: Admit exact producer and free storage headroom
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/okx-cache-acceptance"
          mkdir "$root"
          case "$CACHE_MODE" in
            bootstrap) [[ -z "$PRODUCER_RUN$PRODUCER_SHA$BUNDLE_DIGEST" ]] ;;
            restore)
              [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
              [[ "$PRODUCER_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" > "$root/producer.json"
              ;;
            *) exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$root/current.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > "$root/usage.json"
          python -m crypto_boom.okx_cache admit --root "$root"
      - name: Restore only the exact admitted producer cache
        if: inputs.mode == 'restore'
        id: restored
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/okx-cache-acceptance/transfer
          key: ${{ steps.identity.outputs.restore_key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Validate recovery, failure stops and bounded full-pool measurements
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
        run: |
          python -m crypto_boom.okx_cache run --root "$RUNNER_TEMP/okx-cache-acceptance"
      - name: Recheck free storage headroom before save
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > "$RUNNER_TEMP/okx-cache-acceptance/usage.json"
          python -m crypto_boom.okx_cache admit --root "$RUNNER_TEMP/okx-cache-acceptance"
      # Only a manifest-validated bounded directory is saved. No automatic post save.
      - name: Save one bounded shadow checkpoint and market snapshot
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/okx-cache-acceptance/transfer
          key: ${{ steps.identity.outputs.save_key }}
          enableCrossOsArchive: false
      - name: Record acceptance result
        if: always()
        shell: bash
        run: |
          {
            echo '### Single-cache Stage 3 acceptance'
            echo 'Exact producer recovery only; missing/corrupt/expired state never enables notifications.'
            echo 'No alert publication or artifact upload; no p95 or automatic disaster-recovery guarantee.'
            if [[ -s "$RUNNER_TEMP/okx-cache-acceptance/acceptance-report.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/okx-cache-acceptance/acceptance-report.json"
              echo '```'
            else
              echo 'Acceptance failed or was skipped; no successful report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
