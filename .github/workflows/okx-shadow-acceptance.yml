name: OKX shadow acceptance

# Manual diagnostics only. No alert publication or persistent runner storage.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-shadow-manual
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_CACHE: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies with uv
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.17
          uv pip install --python "$(command -v python)" --no-cache -r requirements.txt -r requirements-dev.txt
          uv pip freeze --python "$(command -v python)"
      - name: Verify offline contracts and process recovery
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/okx-shadow-tests"
          python -m ruff check --no-cache --select F,I,RUF100 src tests
      - name: Probe eight OKX products without publication
        shell: bash
        run: |
          python -m crypto_boom.okx_scan --workspace "$RUNNER_TEMP/okx-shadow-scan" --limit 8 --workers 4 | tee "$RUNNER_TEMP/okx-shadow-report.txt"
      - name: Record acceptance boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### OKX shadow acceptance'
            echo 'Tests establish software contracts; this eight-product cold probe is not full-pool or latency-p95 acceptance.'
            echo 'No alert publication, cache save, or artifact upload. State exists only on this ephemeral runner.'
            if [[ -s "$RUNNER_TEMP/okx-shadow-report.txt" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/okx-shadow-report.txt"
              echo '```'
            else
              echo 'No successful probe report; inspect the failed or skipped step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
