name: Offline checks

"on":
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements*.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: offline-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.17
          uv pip install --python "$(command -v python)" --no-cache -r requirements.txt -r requirements-dev.txt
      - name: Offline regression
        id: tests
        shell: bash
        run: python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/offline-tests"
      - name: Static checks
        id: lint
        if: success() || failure()
        shell: bash
        run: python -m ruff check --no-cache --select F,I,RUF100 src tests
      - name: Show check disposition
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          {
            printf '### Offline checks\n\n'
            printf 'Revision: `%s`\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n|---|---|\n'
            printf '| Regression | %s |\n| Ruff | %s |\n' "$TEST_OUTCOME" "$LINT_OUTCOME"
            printf '\nNo market scan, alert publication, cache or artifact upload.\n'
          } >> "$GITHUB_STEP_SUMMARY"
