name: Offline checks

"on":
  pull_request:
    branches: [main]
    paths: ["alert.py", "src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
defaults:
  run:
    shell: bash

concurrency:
  group: offline-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          activate-environment: true
          enable-cache: false # Keep storage exclusively for bounded scanner state.
          cache-python: false
      - name: Install locked test dependencies
        run: uv sync --locked --no-cache --no-python-downloads
      - name: Offline regression
        id: tests
        run: uv run --locked --no-sync pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/offline-tests"
      - name: Static checks
        id: lint
        if: success() || failure()
        run: uv run --locked --no-sync ruff check --no-cache --select F,I,RUF100 alert.py src tests
      - name: Show check disposition
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          {
            printf '### Offline checks\n\n'
            printf 'Revision: `%s`\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n|---|---|\n'
            printf '| Regression | %s |\n| Ruff | %s |\n' "$TEST_OUTCOME" "$LINT_OUTCOME"
            printf '\nNo market scan, alert publication, cache or artifact upload.\n'
          } >> "$GITHUB_STEP_SUMMARY"
